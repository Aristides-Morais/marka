services:
  db:
    image: postgres:16-alpine
    container_name: marka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marka
      POSTGRES_PASSWORD: marka_dev_password
      POSTGRES_DB: marka
    ports:
      - "5433:5432"
    volumes:
      - marka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marka -d marka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marka_pgdata:
